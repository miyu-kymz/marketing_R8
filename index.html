<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketPBL | 久留米商圏 営業利益バトル＆損益分析シミュレーター</title>

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0ODQw80oBlLCXZDayamSpTLR59ObodRI",
      authDomain: "marketing-r8.firebaseapp.com",
      databaseURL: "https://marketing-r8-default-rtdb.firebaseio.com",
      projectId: "marketing-r8",
      storageBucket: "marketing-r8.firebasestorage.app",
      messagingSenderId: "293224293790",
      appId: "1:293224293790:web:e7021e1707cd761e43e28f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- クラウドからのリアルタイム受信 ---
    const marketRef = ref(db, 'marketData');
    onValue(marketRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.stores = data.stores || [];
        window.currentEvent = data.currentEvent || null;
        window.currentMonth = data.currentMonth || 4; // デフォルト4月
        window.noneVotes = data.noneVotes || 0;
        window.noneReasons = data.noneReasons || [];
        
        // 全画面の再描画
        if (typeof window.renderMonthBanner === 'function') window.renderMonthBanner();
        if (typeof window.renderTeamsList === 'function') window.renderTeamsList();
        if (typeof window.renderMapPins === 'function') window.renderMapPins();
        if (typeof window.renderVotingStores === 'function') window.renderVotingStores();
        if (typeof window.updateDashboard === 'function') window.updateDashboard();
        
        if (window.currentEvent) {
          if (typeof window.applyEventUI === 'function') window.applyEventUI();
        } else {
          const voteBanner = document.getElementById('voting-event-alert');
          if (voteBanner) voteBanner.classList.add('hidden');
          const pingDot = document.getElementById('event-active-dot');
          if (pingDot) pingDot.classList.add('hidden');
        }
      }
    });

    // --- クラウドへの保存関数（グローバルに統一） ---
    window.saveStorage = function() {
      const stateObj = {
        stores: window.stores || [],
        currentEvent: window.currentEvent || null,
        currentMonth: window.currentMonth || 4,
        noneVotes: window.noneVotes || 0,
        noneReasons: window.noneReasons || [],
        updatedAt: Date.now()
      };
      localStorage.setItem('market_sim_stores_v5', JSON.stringify(stateObj));
      set(ref(db, 'marketData'), stateObj).catch(err => {
        console.error("Firebase保存エラー:", err);
      });
    };
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;

      height: 6px;

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

      <div class="flex items-center space-x-3">

          久
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-400 text-slate-900 font-extrabold shadow-sm">久留米商圏PBL</span>
            <span class="text-xs text-blue-200">月次決算・損益分析シミュレーター</span>
          </div>
          <h1 class="text-base sm:text-lg font-black tracking-tight">久留米エリア 営業利益バトル＆季節変動シミュレーター</h1>

      </div>

      <!-- Header Controls: 現在の営業月バッジ ＆ 管理者入室ボタン -->

  <!-- 営業月の季節環境バナー（生徒向けに常時表示） -->
  <div id="month-environment-banner" class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white border-b border-indigo-800/60 py-2 px-4 shadow-inner text-xs">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span id="env-month-icon" class="text-lg">🌸</span>
        <div>

          <span id="env-month-desc" class="text-slate-300 ml-1">新入生の部活探し＆放課後買い食いピーク！全店客数+15%の春特需！</span>

  <!-- Tab Navigation（生徒用：4画面集約） -->
  <div class="bg-white border-b border-slate-200 sticky top-[58px] z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between overflow-x-auto custom-scrollbar">
      <div class="flex space-x-1 sm:space-x-2 py-2">
        <button class="nav-tab active px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm transition" data-tab="tab-teams">

        </button>
        <button class="nav-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5" data-tab="tab-map">

          ② 久留米商圏マップ
        </button>
        <button class="nav-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5" data-tab="tab-voting">

        </button>

  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">

    <!-- TAB 1: 4P STORE MANAGEMENT -->
    <div id="tab-teams" class="tab-content space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Store Input Form -->
        <div class="lg:col-span-5 bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200">
          <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
            <div>
              <h2 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
                <i data-lucide="calculator" class="w-5 h-5 text-indigo-600"></i>
                出店・価格・コスト構造の設計（4P）
              </h2>
              <p class="text-xs text-slate-500">価格・変動費（1個あたり）と月額固定費を設定</p>
            </div>
            <span id="editing-indicator" class="hidden text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">編集中</span>
          </div>

          <form id="store-form" class="space-y-3.5 text-xs">
            <input type="hidden" id="edit-team-id" value="">

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-600 mb-1">班名 / チーム名</label>
                <input type="text" id="team-name" placeholder="例: 1班 (男子運動部)" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
              </div>
              <div>
                <label class="block font-bold text-slate-600 mb-1">店名</label>
                <input type="text" id="store-name" placeholder="例: 爆盛からあげ天国" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs font-bold">
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block font-bold text-slate-600 mb-1">アイコン</label>
                <input type="text" id="store-icon" value="🍗" required class="w-full px-2 py-1.5 rounded-xl border border-slate-200 text-center text-lg">
              </div>
              <div class="col-span-2">
                <label class="block font-bold text-slate-600 mb-1">業態カテゴリ</label>
                <select id="store-category" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs bg-white">
                  <option value="snack">軽食・ファストフード（ボリューム・手軽さ）</option>
                  <option value="cafe">カフェ・スイーツ（映え・トーク）</option>
                  <option value="study">自習・コワーキング（静寂・電源）</option>
                  <option value="convenience">ミニ売店スタンド（スピード・安さ）</option>
                </select>
              </div>
            </div>

            <!-- Product & Variable Costs -->
            <div class="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 space-y-2.5">
              <span class="text-[10px] font-black text-indigo-700 uppercase tracking-wider block">1. Product & Price (価格と変動費設計)</span>
              
              <div class="p-2.5 bg-white rounded-lg border border-indigo-200/70 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-extrabold text-indigo-900 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-indigo-600"></span> ★ 主力商品（看板メニュー）
                  </span>
                  <span id="main-margin-badge" class="text-[9px] text-emerald-700 bg-emerald-50 px-1.5 py-0.2 rounded font-mono font-bold">限界利益: ¥280 (62%)</span>
                </div>
                <div>
                  <input type="text" id="prod-name" placeholder="商品名: 秘伝タレ唐揚げ丼 (メガ盛)" required class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-bold">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-0.5">販売価格 (円)</label>
                    <input type="number" id="price-point" value="450" min="100" max="2500" step="10" required oninput="calcMarginPreview()" class="w-full px-2 py-1 rounded-lg border border-slate-200 text-xs font-mono font-bold">
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-0.5">変動費 (円/個: 原材料・包材)</label>
                    <input type="number" id="unit-variable-cost" value="170" min="10" max="2000" step="10" required oninput="calcMarginPreview()" class="w-full px-2 py-1 rounded-lg border border-slate-200 text-xs font-mono font-bold text-rose-600">
                  </div>
                </div>
              </div>

              <!-- Sub-products -->

                    <i data-lucide="plus" class="w-3 h-3"></i> 商品を追加
                  </button>
                </div>
                <div id="subproducts-container" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-0.5"></div>
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1 border-t border-indigo-100">
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 mb-0.5">品質傾向</label>
                  <select id="prod-quality" class="w-full px-2 py-1 rounded-lg border border-slate-200 text-xs bg-white">
                    <option value="budget">コスパ重視（量・安さ）</option>
                    <option value="standard" selected>スタンダード（手頃）</option>
                    <option value="premium">プレミアム（高付加価値）</option>
                  </select>
                </div>
                <div>

                  <select id="prod-vibe" onchange="toggleCustomField('prod-vibe', 'prod-vibe-custom')" class="w-full px-2 py-1 rounded-lg border border-slate-200 text-xs bg-white">
                    <option value="chill">賑やか・たまり場</option>
                    <option value="aesthetic">写真映え・おしゃれ</option>
                    <option value="quiet">静寂・集中・Wi-Fi</option>
                    <option value="speed">スピード・即提供</option>
                    <option value="__custom__">その他（自由に設定を入力）</option>
                  </select>
                  <input type="text" id="prod-vibe-custom" placeholder="雰囲気を入力（例: テラス席完備）" class="hidden mt-1 w-full px-2 py-1 rounded-lg border border-indigo-300 bg-indigo-50/50 text-xs">
                </div>
              </div>
            </div>

            <!-- Place & Fixed Costs -->
            <div class="p-3 bg-amber-50/50 rounded-xl border border-amber-100 space-y-2">
